[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/holder",
    "crates/holder-linux",
    "crates/holder-windows",
    "crates/holder-ffi",
    "crates/verifier",
    "crates/issuer",
    "crates/registry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
clavis-protocol = { path = "crates/protocol" }
clavis-holder = { path = "crates/holder" }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
sha2 = "0.10.8"
hkdf = "0.12.4"
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5.1"
jni = "0.21.1"
